name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require isolated installable skill
        run: |
          test -s skills/instagram-brand-director/SKILL.md
          test ! -e SKILL.md
          test -s skills/instagram-brand-director/knowledge/instagram-rules.md
          test -s skills/instagram-brand-director/references/implementation-status.json
      - name: Compile Python
        run: |
          python3 -m compileall -q scripts skills/instagram-brand-director/scripts
      - name: Unit and deterministic behavior contract tests
        run: |
          python3 -m unittest discover -s tests -v
      - name: Knowledge age advisory (non-blocking, no network)
        continue-on-error: true
        run: |
          python3 -m scripts.knowledge_age knowledge/instagram-rules.md --max-age-days 60
      - name: Phase 1 synthetic CLI smoke checks
        run: |
          python3 -m scripts.account_state examples/account-state.zero-follower-editorial.sample.json > "$RUNNER_TEMP/zero.json"
          python3 -m scripts.account_state examples/account-state.dormant-digital-store.sample.json > "$RUNNER_TEMP/dormant.json"
          python3 -m scripts.account_state examples/account-state.established-wholesale.sample.json > "$RUNNER_TEMP/established.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); assert json.loads((p/"zero.json").read_text())["state"] == "COLD_START"; assert json.loads((p/"dormant.json").read_text())["state"] == "DORMANT"; assert json.loads((p/"established.json").read_text())["state"] == "ACTIVE_WITH_BASELINE"'
          python3 -m scripts.calibrate_thresholds examples/calibration.wholesale.posts.sample.csv --growth examples/calibration.wholesale.growth.sample.json --today 2026-11-09 --output "$RUNNER_TEMP/config.proposed.json" > "$RUNNER_TEMP/calibration-summary.txt"
          test -s "$RUNNER_TEMP/config.proposed.json"
      - name: Phase 3 private-intake and evidence gates (read-only synthetic CLIs)
        run: |
          python3 skills/instagram-brand-director/scripts/post_intake.py --brand skills/instagram-brand-director/templates/brand.md --post examples/post-intake.sample.json > "$RUNNER_TEMP/post-intake.json"
          python3 -m scripts.review_gate examples/review-gate.sample.json > "$RUNNER_TEMP/review.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); assert json.loads((p/"post-intake.json").read_text())["status"] == "NEEDS_INPUT"; assert json.loads((p/"review.json").read_text())["decision"] == "INSUFFICIENT_DATA"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual Skills CLI isolated install smoke test
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/igbd-consumer"
          cd "$RUNNER_TEMP/igbd-consumer"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" --skill instagram-brand-director --agent codex --yes
          TARGET=".agents/skills/instagram-brand-director"
          test -s "$TARGET/SKILL.md"
          test -s "$TARGET/scripts/trial_review.py"
          test -s "$TARGET/knowledge/instagram-rules.md"
          test -s "$TARGET/agents/openai.yaml"
          test -s "$TARGET/scripts/baseline_builder.py"
          test -s "$TARGET/scripts/account_state.py"
          test -s "$TARGET/scripts/calibrate_thresholds.py"
          test -s "$TARGET/scripts/knowledge_age.py"
          test -s "$TARGET/scripts/post_intake.py"
          test -s "$TARGET/scripts/review_gate.py"
          test -s "$TARGET/references/persian-review-checklist.md"
          test ! -e "$TARGET/.github"
          test ! -e "$TARGET/tests"
          test ! -e "$TARGET/evals"
          test "$(find "$TARGET/modules" -name '*.md' | wc -l | tr -d ' ')" = "16"
          echo "Skill installed in isolation and does not include repository CI/tests/fixtures"
      - name: Cost-free agent fixture preparation smoke test
        run: |
          python3 tools/run_agent_eval.py --mode prepare --output "$RUNNER_TEMP/igbd-eval-prep"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["case_count"]>=10 and not d["actual_model_executed"]' "$RUNNER_TEMP/igbd-eval-prep/summary.json"
